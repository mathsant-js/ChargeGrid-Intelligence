<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">Sequência do Golden Path automático da Sprint 4</title>
  <desc id="desc">Sessões, runner automático, telemetria, Equal Share, dashboard, previsão, billing e ESG.</desc>
  <defs><style>.bg{fill:#071f19}.head{fill:#124535;stroke:#43e7a3;stroke-width:2}.t{fill:#f3fff9;font:600 18px Arial,sans-serif}.s{fill:#c9e7db;font:15px Arial,sans-serif}.h{fill:#43e7a3;font:700 28px Arial,sans-serif}.life{stroke:#537f6e;stroke-width:2;stroke-dasharray:7 7}.msg{stroke:#8ef1c8;stroke-width:2;marker-end:url(#a)}.ret{stroke:#f4c95d;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#b)}.note{fill:#4a3915;stroke:#f4c95d;stroke-width:2}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8ef1c8"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4c95d"/></marker></defs>
  <rect class="bg" width="1500" height="1040" rx="20"/><text class="h" x="40" y="50">Golden Path automático · Sprint 4</text>
  <g><rect class="head" x="35" y="85" width="150" height="55" rx="10"/><text class="t" x="73" y="119">Usuário</text><rect class="head" x="240" y="85" width="170" height="55" rx="10"/><text class="t" x="277" y="119">Dashboard</text><rect class="head" x="465" y="85" width="150" height="55" rx="10"/><text class="t" x="515" y="119">API</text><rect class="head" x="670" y="85" width="170" height="55" rx="10"/><text class="t" x="713" y="119">Runner</text><rect class="head" x="895" y="85" width="170" height="55" rx="10"/><text class="t" x="927" y="119">Provider</text><rect class="head" x="1120" y="85" width="170" height="55" rx="10"/><text class="t" x="1155" y="119">Equal Share</text><rect class="head" x="1345" y="85" width="120" height="55" rx="10"/><text class="t" x="1371" y="119">Banco</text></g>
  <g><line class="life" x1="110" y1="140" x2="110" y2="995"/><line class="life" x1="325" y1="140" x2="325" y2="995"/><line class="life" x1="540" y1="140" x2="540" y2="995"/><line class="life" x1="755" y1="140" x2="755" y2="995"/><line class="life" x1="980" y1="140" x2="980" y2="995"/><line class="life" x1="1205" y1="140" x2="1205" y2="995"/><line class="life" x1="1405" y1="140" x2="1405" y2="995"/></g>
  <line class="msg" x1="110" y1="190" x2="540" y2="190"/><text class="s" x="210" y="180">inicia 3 sessões de 20 kW</text><line class="msg" x1="540" y1="230" x2="1405" y2="230"/><text class="s" x="820" y="220">persiste sessões</text>
  <line class="msg" x1="325" y1="285" x2="540" y2="285"/><text class="s" x="350" y="274">POST /simulation/start</text><line class="msg" x1="540" y1="325" x2="755" y2="325"/><text class="s" x="588" y="314">runner idempotente</text>
  <rect class="note" x="655" y="365" width="810" height="325" rx="14"/><text class="t" x="685" y="397">Loop enquanto RUNNING</text>
  <line class="msg" x1="755" y1="435" x2="1405" y2="435"/><text class="s" x="920" y="424">bloqueia checkpoint + lê sessões</text><line class="msg" x1="755" y1="480" x2="980" y2="480"/><text class="s" x="790" y="469">amostra simulada</text><line class="ret" x1="980" y1="520" x2="755" y2="520"/><text class="s" x="800" y="510">solar + qualidade</text><line class="msg" x1="755" y1="560" x2="1205" y2="560"/><text class="s" x="870" y="550">pedidos + limites</text><line class="ret" x1="1205" y1="600" x2="755" y2="600"/><text class="s" x="880" y="590">alocação segura + rateio solar</text><line class="msg" x1="755" y1="642" x2="1405" y2="642"/><text class="s" x="895" y="632">leituras, alertas, acumuladores e checkpoint</text>
  <line class="msg" x1="325" y1="725" x2="540" y2="725"/><text class="s" x="363" y="714">polling /api/v1</text><line class="msg" x1="540" y1="765" x2="1405" y2="765"/><text class="s" x="785" y="754">consulta estado persistido</text><line class="ret" x1="540" y1="805" x2="325" y2="805"/><text class="s" x="345" y="795">KPIs, gráficos, ESG e alertas</text>
  <line class="msg" x1="110" y1="850" x2="540" y2="850"/><text class="s" x="182" y="840">4ª sessão e encerramento</text><rect class="note" x="690" y="830" width="560" height="75" rx="10"/><text class="t" x="735" y="860">80 kW = 20 kW solar + 60 kW rede</text><text class="s" x="820" y="886">zero violações</text>
  <line class="msg" x1="325" y1="945" x2="540" y2="945"/><text class="s" x="354" y="934">previsão a +60 min</text><line class="msg" x1="540" y1="980" x2="1405" y2="980"/><text class="s" x="730" y="969">grava risco/recomendação; ML não controla potência</text>
</svg>
